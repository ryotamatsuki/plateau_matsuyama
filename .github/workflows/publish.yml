name: Import PLATEAU and publish GIS
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', 'tools/**', 'tests/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import original building tiles once
        run: |
          if [ ! -f data/buildings/tileset.json ]; then
            curl --fail --location --retry 3 --output /tmp/plateau.zip 'https://assets.cms.plateau.reearth.io/assets/76/85a84e-28a7-4e37-83c2-23a0498255a3/38201_matsuyama-shi_city_2020_3dtiles_mvt_7_op.zip'
            python scripts/import_data.py /tmp/plateau.zip
            python scripts/validate.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m 'Import original Matsuyama 2020 v4 LOD1 building tiles'
            git pull --rebase origin main
            git push
          fi
      - name: Resume GSI elevation cache in checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for batch in 1 2 3 4 5 6 7 8; do
            python tools/fetch_gsi_elevation.py --max-new 50
            git add data/elevation
            if ! git diff --cached --quiet; then
              git commit -m "Cache GSI elevation data batch ${batch}"
              git pull --rebase origin main
              git push
            fi
            if python -c "import json,pathlib,sys; m=json.loads(pathlib.Path('data/elevation/manifest.json').read_text(encoding='utf-8')); sys.exit(0 if m.get('complete') else 1)"; then
              break
            fi
          done
          python -c "import json,pathlib; m=json.loads(pathlib.Path('data/elevation/manifest.json').read_text(encoding='utf-8')); assert m.get('complete'), 'GSI elevation cache is still incomplete'; print('GSI elevation cache complete: {}/{} PNG tiles; missing={}'.format(m['availableTiles'],m['expectedTiles'],m['missingTileCount']))"
      - name: Install GIS analysis dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-analysis.txt
      - name: Build hazard vectors, building risk joins and 3D water LOD
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_risk_analysis_v2.py
          python tools/build_water_3d.py
          python scripts/validate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analysis
          if ! git diff --cached --quiet; then
            git commit -m 'Build Matsuyama urban risk analysis assets'
            git pull --rebase origin main
            git push
          fi
      - name: Prepare analysis and elevation assets for Pages
        run: |
          rm -rf docs/elevation docs/analysis
          cp -a data/elevation docs/elevation
          cp -a data/analysis docs/analysis
      - name: Validate site
        run: |
          node --check docs/app.js
          node --check docs/gsi-terrain.js
          node --check docs/walk-mode.js
          node --check docs/water-volume.js
          node --check docs/immersive-gis.js
          python scripts/validate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Install Playwright for deployed E2E
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: E2E smoke test deployed Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -fsS "$PAGE_URL" >/dev/null; then break; fi
            sleep 5
          done
          node tests/e2e.mjs "$PAGE_URL"
      - name: Upload deployed E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-immersive-e2e-screenshots
          path: e2e-artifacts
          if-no-files-found: ignore
