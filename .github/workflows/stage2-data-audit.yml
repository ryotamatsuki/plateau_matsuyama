name: Stage 2 PLATEAU data audit
on:
  push:
    branches: [stage2-lod2-data-audit]
    paths:
      - 'tools/audit_stage2_citygml.py'
      - '.github/workflows/stage2-data-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/audit_stage2_citygml.py
      - name: Audit Stage 1 bbox against PLATEAU CityGML
        run: python tools/audit_stage2_citygml.py --out stage2-audit
      - name: Show audit summary
        run: cat stage2-audit/stage2-data-audit.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: stage2-data-audit
          path: stage2-audit
          if-no-files-found: error
