name: Final runtime validation

on:
  push:
    branches: ['feature/runtime-performance-no-quality-loss']

permissions:
  contents: write

concurrency:
  group: runtime-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply no-quality-loss terrain refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/walk-mode.js')
          s = p.read_text()
          old = "C.sampleTerrainMostDetailed(viewer.terrainProvider, [C.Cartographic.fromDegrees(state.lon, state.lat)])"
          new = "C.sampleTerrain(viewer.terrainProvider, 14, [C.Cartographic.fromDegrees(state.lon, state.lat)])"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('walk terrain refinement anchor missing')
          PY

      - name: Static validation
        run: |
          node --check docs/app.js
          node --check docs/data-store.js
          node --check docs/gsi-terrain.js
          node --check docs/walk-mode.js
          node --check docs/water-volume.js
          node --check docs/immersive-gis.js
          node --check tests/perf.mjs
          node --check tests/e2e.mjs
          python -m py_compile tests/summarize_perf.py
          python scripts/validate.py
          git diff --check
          test -z "$(git diff eb9393db71d8982277a7eedf6c155f68a117ac2c --name-only -- data/analysis data/elevation data/buildings)"

      - name: Prepare baseline and local data
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/matsuyama-baseline eb9393db71d8982277a7eedf6c155f68a117ac2c
          ln -s "$GITHUB_WORKSPACE/data/elevation" "$GITHUB_WORKSPACE/docs/elevation"
          ln -s "$GITHUB_WORKSPACE/data/analysis" "$GITHUB_WORKSPACE/docs/analysis"
          ln -s "$GITHUB_WORKSPACE/data/elevation" /tmp/matsuyama-baseline/docs/elevation
          ln -s "$GITHUB_WORKSPACE/data/analysis" /tmp/matsuyama-baseline/docs/analysis

      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python -m pip install --disable-pip-version-check pillow

      - name: Baseline/candidate performance and equality
        shell: bash
        env:
          PERF_SAMPLE_MS: '3000'
          PERF_MOVE_MS: '2600'
          PERF_INPUT_N: '10'
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory "$GITHUB_WORKSPACE/docs" >/tmp/candidate-http.log 2>&1 &
          CANDIDATE_PID=$!
          python3 -m http.server 8001 --directory /tmp/matsuyama-baseline/docs >/tmp/baseline-http.log 2>&1 &
          BASELINE_PID=$!
          trap 'kill $CANDIDATE_PID $BASELINE_PID || true' EXIT
          for port in 8000 8001; do
            for i in {1..30}; do
              curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 1
            done
          done
          node tests/perf.mjs http://127.0.0.1:8001/ http://127.0.0.1:8000/
          python tests/summarize_perf.py perf-artifacts | tee perf-artifacts/report.txt

      - name: Chromium and WebKit regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8010 --directory "$GITHUB_WORKSPACE/docs" >/tmp/e2e-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8010/ >/dev/null && break
            sleep 1
          done
          E2E_ARTIFACT_DIR=e2e-artifacts node tests/e2e.mjs http://127.0.0.1:8010/

      - name: Persist validated code and measured report
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/elevation docs/analysis
          rm -rf tests/__pycache__
          git add docs/walk-mode.js tests/perf.mjs tests/summarize_perf.py PERFORMANCE_OPTIMIZATION.md
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "Finalize measured runtime optimization"
            git push origin HEAD:feature/runtime-performance-no-quality-loss
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-validation
          path: |
            perf-artifacts
            e2e-artifacts
            PERFORMANCE_OPTIMIZATION.md
          if-no-files-found: ignore
