name: Walk W2.2 GLB avatar validation
on:
  push:
    branches: [walk-w2-2-glb-avatar]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: |
          node --check docs/walk-mode.js
          node --check tests/walk-w2-2-e2e.mjs
          python scripts/validate.py
      - name: Prepare local Pages tree
        run: |
          rm -rf docs/elevation docs/analysis
          cp -a data/elevation docs/elevation
          cp -a data/analysis docs/analysis
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: W2.2 browser validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory docs >/tmp/walk-w2-2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node tests/walk-w2-2-e2e.mjs http://127.0.0.1:8000/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: walk-w2-2
          path: e2e-artifacts
          if-no-files-found: ignore
