name: Build and measure runtime optimization
on:
  push:
    branches: ['feature/runtime-performance-no-quality-loss']
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic optimizations
        run: |
          python tools/apply_runtime_optimizations.py
          sed -i "1c'use strict';" docs/data-store.js
      - name: Static validation
        run: |
          node --check docs/app.js
          node --check docs/data-store.js
          node --check docs/gsi-terrain.js
          node --check docs/walk-mode.js
          node --check docs/water-volume.js
          node --check docs/immersive-gis.js
          node --check tests/perf.mjs
          python -m py_compile tests/summarize_perf.py
          python scripts/validate.py
          git diff --check
      - name: Prepare identical baseline and candidate data trees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/matsuyama-baseline eb9393db71d8982277a7eedf6c155f68a117ac2c
          ln -s "$GITHUB_WORKSPACE/data/elevation" "$GITHUB_WORKSPACE/docs/elevation"
          ln -s "$GITHUB_WORKSPACE/data/analysis" "$GITHUB_WORKSPACE/docs/analysis"
          ln -s "$GITHUB_WORKSPACE/data/elevation" /tmp/matsuyama-baseline/docs/elevation
          ln -s "$GITHUB_WORKSPACE/data/analysis" /tmp/matsuyama-baseline/docs/analysis
      - name: Install browser benchmark dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python -m pip install --disable-pip-version-check pillow
      - name: Run baseline/candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory "$GITHUB_WORKSPACE/docs" >/tmp/candidate-http.log 2>&1 &
          CANDIDATE_PID=$!
          python3 -m http.server 8001 --directory /tmp/matsuyama-baseline/docs >/tmp/baseline-http.log 2>&1 &
          BASELINE_PID=$!
          trap 'kill $CANDIDATE_PID $BASELINE_PID || true' EXIT
          for port in 8000 8001; do
            for i in {1..30}; do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break; sleep 1; done
          done
          node tests/perf.mjs http://127.0.0.1:8001/ http://127.0.0.1:8000/ 2>&1 | tee /tmp/perf-run.log
          python tests/summarize_perf.py perf-artifacts 2>&1 | tee -a /tmp/perf-run.log
      - name: Candidate browser E2E regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8010 --directory "$GITHUB_WORKSPACE/docs" >/tmp/e2e-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8010/ >/dev/null && break; sleep 1; done
          E2E_ARTIFACT_DIR=e2e-artifacts node tests/e2e.mjs http://127.0.0.1:8010/ 2>&1 | tee /tmp/e2e-run.log
      - name: Persist failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/perf-run.log /tmp/PERF_FAILURE.log 2>/dev/null || true
          cp /tmp/e2e-run.log /tmp/E2E_FAILURE.log 2>/dev/null || true
          git reset --hard HEAD
          rm -f docs/elevation docs/analysis
          cp /tmp/PERF_FAILURE.log PERF_FAILURE.log 2>/dev/null || true
          cp /tmp/E2E_FAILURE.log E2E_FAILURE.log 2>/dev/null || true
          git add PERF_FAILURE.log E2E_FAILURE.log 2>/dev/null || git add PERF_FAILURE.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Record runtime optimization gate failure" || exit 0
          git push origin HEAD:feature/runtime-performance-no-quality-loss
      - name: Commit validated optimization
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/elevation docs/analysis
          git rm tools/apply_runtime_optimizations.py .github/workflows/runtime-optimize.yml
          git rm -f PERF_FAILURE.log E2E_FAILURE.log 2>/dev/null || true
          git add docs tests .github/workflows/ci.yml PERFORMANCE_OPTIMIZATION.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Optimize runtime without reducing GIS quality"
          git push origin HEAD:feature/runtime-performance-no-quality-loss
      - name: Upload benchmark and regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-evidence
          path: |
            perf-artifacts
            e2e-artifacts
            PERFORMANCE_OPTIMIZATION.md
          if-no-files-found: ignore
