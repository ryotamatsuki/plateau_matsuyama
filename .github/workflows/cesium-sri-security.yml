name: Cesium CDN SRI security regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/cesium-sri.test.cjs
