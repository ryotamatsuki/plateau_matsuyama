name: Verify Cesium versioned CDN and SRI prerequisites
on:
  push:
    branches: [security/cesium-sri-cdn-20261102]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/cesium-cdn-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cesium-cdn-probe
          path: security-reports/cesium-cdn-probe.json
